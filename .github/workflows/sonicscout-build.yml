name: SonicScout Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore tools/SonicScoutCSharp/SonicScout.CSharp.csproj
      - name: Build
        run: dotnet build tools/SonicScoutCSharp/SonicScout.CSharp.csproj -c Release --no-restore
