name: First User Windows VM Acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/first-user-vm.yml"
      - "tools/SonicScoutCSharp/**"
      - "powershell/**"
      - "README.md"
  workflow_dispatch:

jobs:
  first-user:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Run clean-machine first-user acceptance matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $results = New-Object System.Collections.Generic.List[object]
          $logDir = Join-Path $env:RUNNER_TEMP 'sonicscout-first-user'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          function Add-Result([string]$Name,[string]$Expected,[string]$Actual,[bool]$Pass,[string]$Notes='') {
            $results.Add([pscustomobject]@{Name=$Name;Expected=$Expected;Actual=$Actual;Pass=$Pass;Notes=$Notes})
            $mark = if($Pass){'PASS'}else{'FAIL'}
            Write-Host "[$mark] $Name :: $Actual"
          }

          Write-Host "=== Machine baseline ==="
          systeminfo | Select-Object -First 40
          powershell.exe -NoProfile -Command '$PSVersionTable | Format-List'
          pwsh.exe -NoProfile -Command '$PSVersionTable | Format-List'
          dotnet --info

          $installBat = 'tools\SonicScoutCSharp\Install-SonicScout.bat'
          $sourceExe = Test-Path 'tools\SonicScoutCSharp\SonicScout.exe'
          Add-Result 'raw checkout starts unbuilt' 'no prebuilt SonicScout.exe required' "prebuilt=$sourceExe" (-not $sourceExe)

          $sourceCommand = '(echo N)| call "' + $installBat + '"'
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d','/c',$sourceCommand -PassThru -Wait -NoNewWindow -RedirectStandardOutput (Join-Path $logDir 'source-install.stdout.log') -RedirectStandardError (Join-Path $logDir 'source-install.stderr.log')
          Add-Result 'README recommended Install-SonicScout.bat recovers from source checkout' 'exit 0 via source launcher/build path' "exit $($p.ExitCode)" ($p.ExitCode -eq 0)

          $publishBat = 'tools\SonicScoutCSharp\publish_sonic_scout.bat'
          $pub = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d','/c',"$publishBat < NUL" -PassThru -Wait -NoNewWindow -RedirectStandardOutput (Join-Path $logDir 'publish-bat.stdout.log') -RedirectStandardError (Join-Path $logDir 'publish-bat.stderr.log')
          Add-Result 'publish_sonic_scout.bat' 'exit 0 and create distributable' "exit $($pub.ExitCode)" ($pub.ExitCode -eq 0)

          $publishedOut = Join-Path $env:USERPROFILE 'Desktop\SonicScout'
          foreach($name in @('SonicScout.exe','Install-SonicScout.bat','setup_audio_stack.ps1','run_audio_stack_setup.bat','auto_setup_dependencies.bat','SonicScout.SonicPass.exe')){
            $ok = Test-Path (Join-Path $publishedOut $name)
            Add-Result "publish batch payload: $name" 'present' "present=$ok" $ok
          }

          # Simulate what a tester gets after downloading and unpacking a package.
          $packageZip = Join-Path $env:RUNNER_TEMP 'SonicScout-package.zip'
          if(Test-Path $packageZip){Remove-Item $packageZip -Force}
          Compress-Archive -Path (Join-Path $publishedOut '*') -DestinationPath $packageZip -Force
          $freshRoot = Join-Path $env:RUNNER_TEMP 'Fresh User Extract\SonicScout'
          if(Test-Path $freshRoot){Remove-Item $freshRoot -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $freshRoot | Out-Null
          Expand-Archive -Path $packageZip -DestinationPath $freshRoot -Force
          $freshExe = Test-Path (Join-Path $freshRoot 'SonicScout.exe')
          Add-Result 'unpacked package contains app' 'SonicScout.exe present after ZIP round-trip' "present=$freshExe" $freshExe

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $freshRoot 'setup_audio_stack.ps1') -Mode Preflight -Quiet *> (Join-Path $logDir 'package-preflight.log')
          $packagePreflight=$LASTEXITCODE
          Add-Result 'unpacked package preflight' 'exit 2 on clean machine, without crash' "exit $packagePreflight" ($packagePreflight -eq 2)

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $freshRoot 'setup_audio_stack.ps1') -Mode Install -DryRun -NonInteractive -OwnershipAccepted *> (Join-Path $logDir 'package-dryrun.log')
          $packageDry=$LASTEXITCODE
          Add-Result 'unpacked package guided setup dry-run' 'exit 0' "exit $packageDry" ($packageDry -eq 0)

          # Exercise live dependency sources without installing anything.
          $downloadBat = Join-Path $freshRoot 'auto_setup_dependencies.bat'
          $downloadAll = Start-Process -FilePath 'cmd.exe' -WorkingDirectory $freshRoot -ArgumentList '/d','/c',"\"$downloadBat\" /download-only" -PassThru -Wait -NoNewWindow -RedirectStandardOutput (Join-Path $logDir 'download-default.stdout.log') -RedirectStandardError (Join-Path $logDir 'download-default.stderr.log')
          Add-Result 'dependency downloads: default stack' 'exit 0' "exit $($downloadAll.ExitCode)" ($downloadAll.ExitCode -eq 0)

          $downloadRea = Start-Process -FilePath 'cmd.exe' -WorkingDirectory $freshRoot -ArgumentList '/d','/c',"\"$downloadBat\" /download-only /reaplugs" -PassThru -Wait -NoNewWindow -RedirectStandardOutput (Join-Path $logDir 'download-reaplugs.stdout.log') -RedirectStandardError (Join-Path $logDir 'download-reaplugs.stderr.log')
          Add-Result 'dependency downloads: ReaPlugs path' 'exit 0' "exit $($downloadRea.ExitCode)" ($downloadRea.ExitCode -eq 0)

          # WPF smoke: a first launch should stay alive rather than crash immediately.
          $appProc = Start-Process -FilePath (Join-Path $freshRoot 'SonicScout.exe') -PassThru
          Start-Sleep -Seconds 20
          $stillRunning = -not $appProc.HasExited
          $appActual = if($stillRunning){'running after 20s'}else{"exited $($appProc.ExitCode)"}
          Add-Result 'unpacked package first-launch smoke' 'process remains alive through preflight/setup opening' $appActual $stillRunning
          if($stillRunning){Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue}

          $directOut = Join-Path $env:RUNNER_TEMP 'SonicScoutPublished'
          dotnet publish tools\SonicScoutCSharp\SonicScout.CSharp.csproj -c Release -r win-x64 --self-contained false -o $directOut *> (Join-Path $logDir 'direct-publish.log')
          $directCode = $LASTEXITCODE
          Add-Result 'direct dotnet publish' 'exit 0' "exit $directCode" ($directCode -eq 0)

          $required = @('SonicScout.exe','setup_audio_stack.ps1','run_audio_stack_setup.bat','auto_setup_dependencies.bat','SonicScout.SonicPass.exe')
          foreach($name in $required){
            $ok = Test-Path (Join-Path $directOut $name)
            Add-Result "published payload: $name" 'present' "present=$ok" $ok
          }
          $installerCount = @(Get-ChildItem (Join-Path $directOut 'installers') -Recurse -File -ErrorAction SilentlyContinue).Count
          Add-Result 'published payload: third-party installers' 'one or more installer files' "count=$installerCount" ($installerCount -gt 0)

          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools\SonicScoutCSharp\setup_audio_stack.ps1'),[ref]$null,[ref]$parseErrors)
          Add-Result 'setup_audio_stack.ps1 parses in Windows PowerShell' '0 parser errors' "errors=$($parseErrors.Count)" ($parseErrors.Count -eq 0)

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\SonicScoutCSharp\setup_audio_stack.ps1 -Mode Preflight -Quiet *> (Join-Path $logDir 'preflight.log')
          $preflightCode = $LASTEXITCODE
          Add-Result 'fresh-machine preflight' 'exit 2 (setup incomplete)' "exit $preflightCode" ($preflightCode -eq 2)

          $variants = @(
            @{Name='auto'; Args=@()},
            @{Name='wave-yes'; Args=@('-WaveLinkRouting','Yes')},
            @{Name='wave-no'; Args=@('-WaveLinkRouting','No')},
            @{Name='vm-yes'; Args=@('-VoicemeeterFallback','Yes')},
            @{Name='vm-no'; Args=@('-VoicemeeterFallback','No')}
          )
          foreach($v in $variants){
            $args = @('-NoProfile','-ExecutionPolicy','Bypass','-File','tools\SonicScoutCSharp\setup_audio_stack.ps1','-Mode','Install','-DryRun','-NonInteractive','-OwnershipAccepted') + $v.Args
            & powershell.exe @args *> (Join-Path $logDir ("setup-dryrun-" + $v.Name + ".log"))
            $code=$LASTEXITCODE
            Add-Result "guided setup dry-run: $($v.Name)" 'exit 0' "exit $code" ($code -eq 0)
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File powershell\Install-SonicScout2.0.ps1 -DryRun *> (Join-Path $logDir 'manual-installer-ps51-dryrun.log')
          $manual51=$LASTEXITCODE
          Add-Result 'manual installer Windows PowerShell 5.1 dry-run' 'exit 0' "exit $manual51" ($manual51 -eq 0)

          $pwshOut = Join-Path $logDir 'manual-installer-pwsh.log'
          $proc = Start-Process -FilePath 'pwsh.exe' -ArgumentList '-NoProfile','-File','powershell\Install-SonicScout2.0.ps1' -PassThru -NoNewWindow -RedirectStandardOutput $pwshOut -RedirectStandardError (Join-Path $logDir 'manual-installer-pwsh.err.log')
          if(-not $proc.WaitForExit(15000)){ $proc.Kill(); $proc.WaitForExit(); $pwshCode=124 } else { $pwshCode=$proc.ExitCode }
          $pwshText = if(Test-Path $pwshOut){Get-Content $pwshOut -Raw}else{''}
          $pwshRefused = $pwshText -match 'requires Windows PowerShell 5\.1'
          Add-Result 'PowerShell 7 refusal' 'explicit Windows PowerShell 5.1 refusal, exit nonzero' "exit=$pwshCode message=$pwshRefused" ($pwshRefused -and $pwshCode -ne 0)

          $csharpReadme = Get-Content tools\SonicScoutCSharp\README_CSHARP.md -Raw
          $staleCSharp = $csharpReadme -match '(?m)(^|\\|\s)CSharp\\'
          Add-Result 'C# README has no stale CSharp\\ source paths' 'no stale CSharp\\ paths' "stale=$staleCSharp" (-not $staleCSharp)

          $results | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $logDir 'summary.json') -Encoding UTF8
          $results | Format-Table -AutoSize | Out-String | Set-Content (Join-Path $logDir 'summary.txt')
          Get-Content (Join-Path $logDir 'summary.txt')
          $fails = @($results | Where-Object { -not $_.Pass })
          "Failures: $($fails.Count)" | Add-Content (Join-Path $logDir 'summary.txt')
          if($fails.Count -gt 0){ exit 1 }

      - name: Upload first-user VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicscout-first-user-vm-evidence
          path: ${{ runner.temp }}\sonicscout-first-user
          if-no-files-found: error
